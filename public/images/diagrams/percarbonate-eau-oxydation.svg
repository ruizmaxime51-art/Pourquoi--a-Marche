<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Action du percarbonate de sodium dans l'eau</title>
  <desc id="desc">Le percarbonate libère du carbonate de sodium, qui rend le bain basique, et du peroxyde d'hydrogène, qui oxyde certains chromophores colorés.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbf8"/>
      <stop offset="1" stop-color="#edf6f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#173d34" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2c6e5b"/>
    </marker>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <text x="600" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#163c33">Ce qui se passe quand le percarbonate rencontre l'eau</text>
  <g filter="url(#shadow)">
    <rect x="55" y="145" width="285" height="375" rx="28" fill="#fff"/>
    <rect x="458" y="145" width="285" height="375" rx="28" fill="#fff"/>
    <rect x="860" y="145" width="285" height="375" rx="28" fill="#fff"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="197" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#163c33">Percarbonate</text>
    <text x="197" y="240" text-anchor="middle" font-size="18" fill="#55736b">granulés secs</text>
    <g fill="#dfe9e5" stroke="#7fa397" stroke-width="3">
      <circle cx="145" cy="330" r="28"/><circle cx="203" cy="315" r="31"/><circle cx="250" cy="357" r="25"/>
      <circle cx="169" cy="380" r="24"/><circle cx="225" cy="397" r="29"/>
    </g>
    <text x="197" y="470" text-anchor="middle" font-size="23" font-weight="700" fill="#2c6e5b">2 Na₂CO₃·3 H₂O₂</text>

    <text x="600" y="205" text-anchor="middle" font-size="26" font-weight="700" fill="#163c33">Dans l'eau</text>
    <path d="M548 310 C548 260 586 235 600 206 C614 235 652 260 652 310 C652 348 629 374 600 374 C571 374 548 348 548 310Z" fill="#bfe7f4" stroke="#4f9fb6" stroke-width="4"/>
    <text x="600" y="430" text-anchor="middle" font-size="20" fill="#55736b">dissociation puis réactions</text>
    <text x="600" y="465" text-anchor="middle" font-size="18" fill="#55736b">progressives dans le bain</text>

    <text x="1002" y="200" text-anchor="middle" font-size="26" font-weight="700" fill="#163c33">Deux effets</text>
    <rect x="905" y="245" width="195" height="100" rx="18" fill="#eef6d7"/>
    <text x="1002" y="280" text-anchor="middle" font-size="21" font-weight="700" fill="#4a641b">Carbonate</text>
    <text x="1002" y="311" text-anchor="middle" font-size="18" fill="#53633a">bain plus basique</text>
    <rect x="905" y="370" width="195" height="108" rx="18" fill="#e6f2ff"/>
    <text x="1002" y="405" text-anchor="middle" font-size="21" font-weight="700" fill="#245a82">Peroxyde H₂O₂</text>
    <text x="1002" y="436" text-anchor="middle" font-size="18" fill="#45677e">oxyde certains</text>
    <text x="1002" y="461" text-anchor="middle" font-size="18" fill="#45677e">chromophores</text>
  </g>
  <line x1="350" y1="332" x2="438" y2="332" stroke="#2c6e5b" stroke-width="7" marker-end="url(#arrow)"/>
  <line x1="753" y1="332" x2="840" y2="332" stroke="#2c6e5b" stroke-width="7" marker-end="url(#arrow)"/>
  <rect x="120" y="570" width="960" height="62" rx="20" fill="#163c33"/>
  <text x="600" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#fff">Un oxydant n'est pas une lessive complète : tache, textile, temps et température comptent.</text>
</svg>
