<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Les cinq mécanismes du vieillissement des aliments frais</title>
  <desc id="desc">Respiration, éthylène, humidité, froid et blessures n’agissent pas de la même façon selon l’aliment.</desc>
  <rect width="1200" height="800" rx="36" fill="#fbf7ee"/>
  <text x="600" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#143c2e">Ce qui fait vieillir un aliment frais</text>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#52645d">Le bon rangement ralentit le mécanisme dominant — sans toujours tout arrêter</text>

  <g transform="translate(55 165)">
    <rect width="202" height="350" rx="28" fill="#eaf4f5" stroke="#2d7180" stroke-width="4"/>
    <circle cx="101" cy="84" r="54" fill="#2d7180"/>
    <path d="M69 84c20-32 44-32 64 0M75 96c17 26 35 26 52 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="69" cy="84" r="7" fill="#fff"/><circle cx="133" cy="84" r="7" fill="#fff"/>
    <text x="101" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#174e59">Respiration</text>
    <text x="101" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3f6268">Le végétal</text>
    <text x="101" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3f6268">consomme sucres</text>
    <text x="101" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#3f6268">et acides</text>
    <text x="101" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#2d7180">→ ramollit</text>
  </g>

  <g transform="translate(277 165)">
    <rect width="202" height="350" rx="28" fill="#fff5dd" stroke="#d38a2b" stroke-width="4"/>
    <circle cx="101" cy="84" r="54" fill="#d38a2b"/>
    <circle cx="78" cy="75" r="10" fill="#fff"/><circle cx="116" cy="62" r="7" fill="#fff"/><circle cx="126" cy="96" r="12" fill="#fff"/>
    <path d="M78 75l38-13 10 34" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="101" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8a5415">Éthylène</text>
    <text x="101" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#725320">Signal de</text>
    <text x="101" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#725320">maturation des</text>
    <text x="101" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#725320">fruits climactériques</text>
    <text x="101" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b06e18">→ fait mûrir</text>
  </g>

  <g transform="translate(499 165)">
    <rect width="202" height="350" rx="28" fill="#e8f1eb" stroke="#3f7a51" stroke-width="4"/>
    <circle cx="101" cy="84" r="54" fill="#3f7a51"/>
    <path d="M101 43c24 31 38 47 38 69a38 38 0 1 1-76 0c0-22 14-38 38-69z" fill="none" stroke="#fff" stroke-width="7"/>
    <text x="101" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#245332">Humidité</text>
    <text x="101" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#496651">Trop peu :</text>
    <text x="101" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#496651">flétrissement</text>
    <text x="101" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#496651">Trop : condensation</text>
    <text x="101" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#3f7a51">→ flétrit / moisit</text>
  </g>

  <g transform="translate(721 165)">
    <rect width="202" height="350" rx="28" fill="#f1ebf5" stroke="#765b89" stroke-width="4"/>
    <circle cx="101" cy="84" r="54" fill="#765b89"/>
    <path d="M101 44v80M67 64l68 40M135 64l-68 40M64 84h74" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="101" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#574067">Froid</text>
    <text x="101" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66566e">Ralentit les</text>
    <text x="101" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66566e">réactions, mais peut</text>
    <text x="101" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#66566e">léser certains fruits</text>
    <text x="101" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#765b89">→ ralentit / lèse</text>
  </g>

  <g transform="translate(943 165)">
    <rect width="202" height="350" rx="28" fill="#f9e9e4" stroke="#c36045" stroke-width="4"/>
    <circle cx="101" cy="84" r="54" fill="#c36045"/>
    <path d="M57 94c20-11 29-39 44-49 14 17 24 40 44 49-14 22-31 32-44 32-15 0-31-10-44-32z" fill="none" stroke="#fff" stroke-width="7"/>
    <path d="M103 48L87 82l22 5-15 38" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="101" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8d402d">Blessures</text>
    <text x="101" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#76544b">Cuticule rompue,</text>
    <text x="101" y="241" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#76544b">cellules exposées,</text>
    <text x="101" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#76544b">germes favorisés</text>
    <text x="101" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#c36045">→ altère vite</text>
  </g>

  <path d="M155 566H1045" stroke="#c9d3cd" stroke-width="5" stroke-linecap="round"/>
  <circle cx="155" cy="566" r="11" fill="#2d7180"/><circle cx="378" cy="566" r="11" fill="#d38a2b"/>
  <circle cx="600" cy="566" r="11" fill="#3f7a51"/><circle cx="822" cy="566" r="11" fill="#765b89"/>
  <circle cx="1045" cy="566" r="11" fill="#c36045"/>

  <rect x="135" y="614" width="930" height="122" rx="28" fill="#143c2e"/>
  <text x="600" y="660" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">Un même froid n’a pas le même effet sur tous les aliments</text>
  <text x="600" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#dbe9e2">Faire mûrir · ralentir · garder sec · limiter la perte d’eau · protéger la peau</text>
</svg>
