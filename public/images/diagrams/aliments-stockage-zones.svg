<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Où ranger les aliments ?</title>
  <desc id="desc">Trois colonnes classent les aliments entre réfrigérateur, plan de travail et garde-manger.</desc>
  <rect width="1200" height="800" rx="36" fill="#fbf7ee"/>
  <text x="600" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#143c2e">Où ranger les aliments ?</text>
  <text x="600" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#52645d">Entiers, non ouverts et dans de bonnes conditions</text>

  <g transform="translate(50 155)">
    <rect width="340" height="560" rx="28" fill="#eaf4f5" stroke="#98bdc3" stroke-width="3"/>
    <circle cx="56" cy="58" r="31" fill="#2d7180"/>
    <path d="M43 43h26v33H43zM48 49h16M48 58h16M48 67h16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="103" y="55" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#174e59">Réfrigérateur</text>
    <text x="103" y="82" font-family="Arial, sans-serif" font-size="15" fill="#47717a">pour la sécurité et la durée</text>
    <line x1="30" y1="112" x2="310" y2="112" stroke="#b8d4d8" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="23" fill="#183b42">
      <text x="38" y="162">✓ Viande et poisson</text>
      <text x="38" y="210">✓ Lait et produits frais</text>
      <text x="38" y="258">✓ Restes cuisinés</text>
      <text x="38" y="306">✓ Fruits coupés</text>
      <text x="38" y="354">✓ Légumes coupés</text>
      <text x="38" y="402">✓ Salades et baies</text>
      <text x="38" y="450">✓ Œufs à la maison</text>
    </g>
    <rect x="28" y="488" width="284" height="48" rx="14" fill="#fff"/>
    <text x="170" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#174e59">Étiquette et chaîne du froid</text>
  </g>

  <g transform="translate(430 155)">
    <rect width="340" height="560" rx="28" fill="#fff5dd" stroke="#e3ba67" stroke-width="3"/>
    <circle cx="56" cy="58" r="31" fill="#d38a2b"/>
    <circle cx="56" cy="55" r="12" fill="none" stroke="#fff" stroke-width="4"/>
    <path d="M56 35V27M56 83v-8M36 55h-8M84 55h-8M42 41l-6-6M76 75l-6-6M70 41l6-6M36 75l6-6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="103" y="55" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8a5415">Plan de travail</text>
    <text x="103" y="82" font-family="Arial, sans-serif" font-size="15" fill="#8f6a34">pour mûrir et préserver le goût</text>
    <line x1="30" y1="112" x2="310" y2="112" stroke="#ead09a" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="23" fill="#513813">
      <text x="38" y="162">✓ Tomates entières</text>
      <text x="38" y="210">✓ Bananes</text>
      <text x="38" y="258">✓ Avocats à mûrir</text>
      <text x="38" y="306">✓ Poires à mûrir</text>
      <text x="38" y="354">✓ Pêches à mûrir</text>
      <text x="38" y="402">✓ Agrumes entiers</text>
      <text x="38" y="450">✓ Melons entiers</text>
    </g>
    <rect x="28" y="488" width="284" height="48" rx="14" fill="#fff"/>
    <text x="170" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a5415">À l’ombre et bien aéré</text>
  </g>

  <g transform="translate(810 155)">
    <rect width="340" height="560" rx="28" fill="#eaf3e9" stroke="#9abd91" stroke-width="3"/>
    <circle cx="56" cy="58" r="31" fill="#3f7a51"/>
    <path d="M37 52h38v25H37zM42 52V39h28v13M48 64h16" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <text x="103" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#245332">Garde-manger</text>
    <text x="103" y="82" font-family="Arial, sans-serif" font-size="15" fill="#55765e">frais, sec, sombre et ventilé</text>
    <line x1="30" y1="112" x2="310" y2="112" stroke="#bdd4ba" stroke-width="2"/>
    <g font-family="Arial, sans-serif" font-size="23" fill="#294a31">
      <text x="38" y="162">✓ Pommes de terre</text>
      <text x="38" y="210">✓ Patates douces</text>
      <text x="38" y="258">✓ Oignons secs</text>
      <text x="38" y="306">✓ Ail sec</text>
      <text x="38" y="354">✓ Courges entières</text>
      <text x="38" y="402">✓ Bocaux non ouverts</text>
      <text x="38" y="450">✓ Produits secs</text>
    </g>
    <rect x="28" y="488" width="284" height="48" rx="14" fill="#fff"/>
    <text x="170" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#245332">Tubercules loin de la lumière</text>
  </g>

  <rect x="175" y="742" width="850" height="40" rx="20" fill="#143c2e"/>
  <text x="600" y="768" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Dès qu’un fruit ou un légume est coupé : réfrigération rapide</text>
</svg>
