<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bilan de masse pour une crufiture d’abricot</title>
  <desc id="desc">Pour 2,5 kilogrammes de fruits à 12 degrés Brix, une cible à 71 degrés Brix et une proportion de fruit de 68 pour cent, le calcul donne 2,31 kilogrammes de sucre, 1,13 kilogramme d’eau évaporée et 3,68 kilogrammes de produit final.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="1" stop-color="#f1f8f4"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f6f62"/>
    </marker>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg2)"/>
  <text x="800" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#173d34">Exemple : le bilan de masse</text>
  <text x="800" y="124" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#49655e">Abricots à 12 °Brix · cible 71 °Brix · fruit = 68 % du produit final</text>

  <rect x="80" y="225" width="340" height="260" rx="32" fill="#ffffff" stroke="#e0a844" stroke-width="4"/>
  <circle cx="250" cy="315" r="58" fill="#f3a23d"/>
  <path d="M250 258c6-26 31-45 61-45" fill="none" stroke="#4d7f54" stroke-width="12" stroke-linecap="round"/>
  <text x="250" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#5c4315">Fruits préparés</text>
  <text x="250" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#344d46">2,50 kg</text>

  <rect x="80" y="555" width="340" height="220" rx="32" fill="#ffffff" stroke="#d5b45f" stroke-width="4"/>
  <path d="M165 665h170l-22 64H187z" fill="#fff2ce" stroke="#b8861a" stroke-width="4"/>
  <circle cx="215" cy="636" r="18" fill="#ffffff" stroke="#b8861a" stroke-width="3"/>
  <circle cx="260" cy="626" r="18" fill="#ffffff" stroke="#b8861a" stroke-width="3"/>
  <circle cx="305" cy="642" r="18" fill="#ffffff" stroke="#b8861a" stroke-width="3"/>
  <text x="250" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#5c4315">Sucres ajoutés</text>
  <text x="250" y="754" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#344d46">2,31 kg</text>

  <path d="M450 480h190" stroke="#2f6f62" stroke-width="9" marker-end="url(#arrow2)"/>
  <path d="M450 665c85 0 112-70 190-105" fill="none" stroke="#2f6f62" stroke-width="9" marker-end="url(#arrow2)"/>

  <rect x="660" y="300" width="390" height="350" rx="36" fill="#ffffff" stroke="#70a992" stroke-width="5"/>
  <rect x="725" y="380" width="260" height="165" rx="24" fill="#f39b37" stroke="#a45d13" stroke-width="5"/>
  <path d="M745 430c55-30 110 30 165 0s55 30 55 30" fill="none" stroke="#ffcf77" stroke-width="12" stroke-linecap="round"/>
  <text x="855" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#205f50">Mélange initial</text>
  <text x="855" y="596" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#344d46">4,81 kg</text>

  <path d="M1080 560h185" stroke="#2f6f62" stroke-width="9" marker-end="url(#arrow2)"/>
  <path d="M1142 403c-22-24-24-51-3-73 22 21 28 45 3 73z" fill="#77b9d2"/>
  <path d="M1182 375c-15-16-16-35-2-49 15 14 20 30 2 49z" fill="#9fd4e4"/>
  <text x="1165" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#286379">Eau évaporée</text>
  <text x="1165" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#286379">1,13 kg</text>

  <rect x="1280" y="300" width="250" height="350" rx="36" fill="#ffffff" stroke="#2f6f62" stroke-width="5"/>
  <path d="M1355 391h100v151c0 35-23 54-50 54s-50-19-50-54z" fill="#f39b37" stroke="#8e581e" stroke-width="5"/>
  <path d="M1348 383h114" stroke="#8e581e" stroke-width="16" stroke-linecap="round"/>
  <text x="1405" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#205f50">Masse finale</text>
  <text x="1405" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#344d46">3,68 kg</text>

  <rect x="420" y="730" width="760" height="100" rx="25" fill="#173d34"/>
  <text x="800" y="770" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">2,50 + 2,31 − 1,13 = 3,68 kg</text>
  <text x="800" y="806" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#d8ebe3">Le calcul suit la masse ; il ne mesure pas l’activité de l’eau.</text>
</svg>
